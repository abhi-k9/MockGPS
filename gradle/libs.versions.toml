[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
activityKtx = "1.10.1"
drawerlayout = "1.2.0"
material = "1.14.0"
maplibre = "13.7.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxRunner = "1.7.0"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
