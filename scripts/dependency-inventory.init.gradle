// Read-only resolution inventory for the independent GitHub Advisory Database check.
// No repository, version, dependency or verification settings are changed here.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def reviewedRoot = gradle.rootProject
    reviewedRoot.tasks.register('exportReviewedDependencyInventory') {
        doLast {
            def output = System.getProperty('mockgps.inventory')
            if (!output) throw new GradleException('Set -Dmockgps.inventory=/absolute/output.json')
            def entries = [:].withDefault { new TreeSet<String>() }
            def scopes = []
            reviewedRoot.allprojects.each { project ->
                def configurations = project.configurations.findAll {
                    it.canBeResolved && it.name in ['debugRuntimeClasspath', 'releaseRuntimeClasspath',
                        'debugUnitTestRuntimeClasspath', 'debugAndroidTestRuntimeClasspath']
                }
                configurations += project.buildscript.configurations.findAll { it.canBeResolved && it.name == 'classpath' }
                configurations.each { configuration ->
                    def scope = "${project.path}:${configuration.name}".toString()
                    scopes += scope
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id
                            entries["${id.group}:${id.module}:${id.version}".toString()] += scope
                        }
                    }
                }
            }
            def modules = entries.sort().collect { gav, usedBy ->
                def parts = gav.split(':', 3)
                [name: "${parts[0]}:${parts[1]}".toString(), version: parts[2], scopes: usedBy.toList()]
            }
            new File(output).text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 1, scopes: scopes.sort(), modules: modules,
                limitations: ['Maven coordinates only; excludes embedded/shaded native code and Gradle distribution internals',
                    'Includes buildscript plugin transitive dependencies; not an exhaustive inventory of SDK/system-image tools']])) + '\n'
            println("Exported ${modules.size()} resolved Maven coordinates to ${output}")
        }
    }
}
